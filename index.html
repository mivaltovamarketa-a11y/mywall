    syncProjects();
    S.projects.push({id:uid(),name:'Nový projekt',color:colorFor(),keywords:[]});save();openProjects();
  },
  delP(el){
    if(!confirm('Smazat projekt? Úkoly zůstanou jako nezařazené.'))return;
    syncProjects();
    S.projects=S.projects.filter(p=>p.id!==el.dataset.id);S.tasks.forEach(t=>{if(t.projectId===el.dataset.id)t.projectId=''});save();openProjects();render();
  },
  dictate(){openDictate('')},
  mic(el){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast('Tento prohlížeč diktování nepodporuje – použij Chrome/Edge, nebo mikrofon na klávesnici telefonu.');return}
    const ta=$('#dictText');
    if(rec){rec.stop();return}
    rec=new SR();rec.lang='cs-CZ';rec.continuous=true;rec.interimResults=true;
    const base=ta.value.trim();
    el.textContent='⏹ Zastavit';
    rec.onresult=e=>{
      const parts=[];
      for(let i=0;i<e.results.length;i++)parts.push(e.results[i][0].transcript.trim());
      ta.value=(base?base+'\n':'')+parts.join('\n');
    };
    rec.onerror=e=>{toast('Mikrofon: '+(e.error==='not-allowed'?'chybí povolení k mikrofonu':e.error))};
    rec.onend=()=>{rec=null;const b=$('#micBtn');if(b)b.textContent='🎤 Diktovat'};
    rec.start();
  },
  analyze(){
    const txt=($('#dictText')||{}).value||'';
    const items=parseDictation(txt,($('#dictMode')||{}).value||'auto');
    if(!items.length){toast('Nenašla jsem v textu žádný úkol ani trénink.');return}
    openTaskPreview(items);
  },
  gptTaskPrompt(){openPrompt('Prompt pro ChatGPT – roztřídění úkolů',buildTaskPrompt(($('#dictText')||{}).value||''))},
  gptTasksApply(){
    const t=($('#gptTasks')||{}).value||'';
    handleText(t,'',true);
  },
  pvAdd(el){
    const rows=[...document.querySelectorAll('#pvList .pv')];
    let nt=0,nw=0;const learned=[];
    rows.forEach(r=>{
      if(!r.querySelector('.pvOn').checked)return;
      const it=pv[+r.dataset.i];
      const title=r.querySelector('.pvTitle').value.trim();if(!title)return;
      if(r.dataset.kind==='workout'){
        addWorkoutItem({title,date:r.querySelector('.pvWDate').value,time:r.querySelector('.pvWTime').value,sport:r.querySelector('.pvSport').value,
          durMin:num(r.querySelector('.pvDur').value),distKm:num(r.querySelector('.pvDist').value),intensity:r.querySelector('.pvInt').value.trim(),desc:it.desc||''});
        nw++;return;
      }
      let pid=r.querySelector('.pvProj').value;
      if(pid==='__new')pid=projIdByName(it.projName);
      if(pid&&pid!==it.sugg&&!it.projName){const a=learn(title,pid);if(a.length)learned.push(...a)}
      S.tasks.push({id:uid(),title,projectId:pid,prio:+r.querySelector('.pvPrio').value||2,due:r.querySelector('.pvDue').value,date:r.querySelector('.pvDate').value,time:it.time||'',est:it.est||30,notes:it.notes||'',done:false,created:Date.now()});
      nt++;
    });
    save();closeModal();
    if(el.dataset.s==='1'&&nt)autoSchedule(view==='tyden'?curWeek:mondayOf(today()));
    render();
    toast(`Přidáno: ${nt} úkolů, ${nw} tréninků${el.dataset.s==='1'&&nt?' (úkoly rozvrženy)':''}${learned.length?' · naučeno: '+learned.slice(0,4).join(', '):''}`);
  },
  gptTrain(el){const base=mondayOf(today());openPrompt('Prompt pro ChatGPT – tréninkový plán',buildTrainingPrompt(addDays(base,7*+el.dataset.w)))},
  gptApply(){handleText(($('#gptIn')||{}).value||'','')},
  pasteApply(){handleText(($('#pasteIn')||{}).value||'','')},
  copyPrompt(){
    const ta=$('#promptTxt');ta.select();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(ta.value).then(()=>toast('Zkopírováno ✓'),()=>{document.execCommand('copy');toast('Zkopírováno ✓')});
    else{document.execCommand('copy');toast('Zkopírováno ✓')}
  },
  exportICS(){exportICS()},
  clearEvents(){if(confirm('Smazat všechny importované události z kalendáře?')){S.events=[];S.eventsU=Date.now();save();render()}},
  gConnect(){gConnect()},gPull(){gPull()},gPush(){gPush()},
  exportBackup(){S.settings.lastBackup=Date.now();save();download(`mywall-zaloha-${today()}.json`,JSON.stringify(S,null,1),'application/json');render();toast('Záloha stažena')},
  resetAll(){if(confirm('Opravdu smazat VŠECHNA data v aplikaci? Pokud je zapnutá synchronizace, smažou se i v cloudu. Nejdřív si stáhni zálohu.')&&confirm('Naposledy: smazat úplně všechno?')){S=defaults();save();render()}},
  demo(){loadDemo()},
  syncOn(){syncOn()},syncNow(){syncNow(true)},syncCode(){syncCode()},syncJoin(){syncJoin()},syncOff(){syncOff()},
  gptNutri(){openPrompt('Prompt pro ChatGPT – odhad jídla',buildNutritionPrompt())},gCalsLoad(){gLoadCals()},
  stravaConnect(){stravaConnect()},stravaSync(){stravaSync(true)},stravaOff(){stravaOff()},

};
function syncProjects(){
  document.querySelectorAll('.prow').forEach(r=>{

const SUB={
  saveW(f,fd){
    const g=k=>fd.get(k)||'';
    let w=g('id')?wkById(g('id')):null;
    if(!w){w={id:uid()};S.workouts.push(w)}
    Object.assign(w,{date:g('date'),time:g('time'),sport:g('sport'),goalId:g('goalId'),title:g('title').trim(),description:g('description').trim(),
      durMin:num(g('durMin')),distKm:num(g('distKm')),intensity:g('intensity').trim(),
      done:fd.has('done'),aDur:num(g('aDur')),aDist:num(g('aDist')),aHr:num(g('aHr')),aMaxHr:num(g('aMaxHr')),rpe:num(g('rpe')),feel:num(g('feel')),pain:g('pain').trim(),notes:g('notes').trim()});
    if(!w.done&&(w.aDur||w.aDist||w.feel))w.done=true;
    if(!w.title)w.title=SPORTS[w.sport].n;
    save();closeModal();render();
  },
  saveT(f,fd){
    const g=k=>fd.get(k)||'';
    let t=g('id')?tkById(g('id')):null;
    if(!t){t={id:uid(),created:Date.now()};S.tasks.push(t)}
    const wasDone=t.done;
    Object.assign(t,{title:g('title').trim(),projectId:g('projectId'),prio:+g('prio')||2,due:g('due'),date:g('date'),time:g('time'),est:num(g('est')),notes:g('notes').trim(),done:fd.has('done')});
    if(t.done&&!wasDone)t.doneAt=Date.now();
    save();closeModal();render();
  },
  saveG(f,fd){
    const g=k=>fd.get(k)||'';
    let o=g('id')?goal(g('id')):null;
    if(!o){o={id:uid(),done:false};S.goals.push(o)}
    Object.assign(o,{title:g('title').trim(),sport:g('sport'),target:g('target').trim(),deadline:g('deadline'),notes:g('notes').trim()});
    save();closeModal();render();
  },
  saveTpl(f,fd){
    const g=k=>fd.get(k)||'';
    let o=g('id')?S.template.find(x=>x.id===g('id')):null;
    if(!o){o={id:uid()};S.template.push(o)}

  saveProjects(){syncProjects();save();closeModal();render();toast('Projekty uloženy')}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=ACT[el.dataset.act];
  if(f){e.preventDefault();f(el,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-submit]');if(!f)return;
  e.preventDefault();
  const fn=SUB[f.dataset.submit];if(fn)fn(f,new FormData(f));
});
document.addEventListener('change',e=>{
  const el=e.target;if(!el.dataset||!el.dataset.change)return;
  const f=CHG[el.dataset.change];if(f)f(el,e);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.matches&&e.target.matches('[data-quick]')){
    const v=e.target.value.trim();if(!v)return;
    const items=parseDictation(v);
    const it=items[0]||{title:v,projectId:'',prio:2,due:'',date:'',time:'',est:30};
    if(it.kind==='workout'){addWorkoutItem(it);save();render();toast('Přidán trénink: '+it.title+(it.date?' · '+fmtDay(it.date):''));return}
    S.tasks.push({id:uid(),title:it.title,projectId:it.projectId,prio:it.prio,due:it.due,date:it.date||(view==='dnes'&&!it.due?today():''),time:it.time,est:it.est,notes:'',done:false,created:Date.now()});
    save();render();
    const p=proj(it.projectId);
    toast(`Přidáno${p?' do projektu '+p.name:''}${it.due?' · termín '+fmtDay(it.due):''}`);
  }
});
/* přetahování mezi dny */
document.addEventListener('dragstart',e=>{
  const el=e.target.closest&&e.target.closest('[data-drag]');
  if(el){e.dataTransfer.setData('text/plain',el.dataset.drag);e.dataTransfer.effectAllowed='move'}
});
document.addEventListener('dragover',e=>{
  const d=e.target.closest&&e.target.closest('[data-drop]');
  if(d){e.preventDefault();document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));d.classList.add('drop')}
});
document.addEventListener('drop',e=>{
  const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;
  e.preventDefault();
  const [k,id]=e.dataTransfer.getData('text/plain').split(':');
  const date=d.dataset.drop;
  if(k==='w'){const w=wkById(id);if(w)w.date=date}
  else if(k==='t'){const t=tkById(id);if(t)t.date=date}
  save();render();
});
document.addEventListener('dragend',()=>document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop')));
window.addEventListener('hashchange',()=>{const h=(location.hash||'#dnes').slice(1);if(h!==view){view=h;render()}});
